<!DOCTYPE html>
<html lang="en">
<head>
  <title>HTML Entities Example</title>
</head>
<body>
  <p>
    &lt; → less than <br>
    &gt; → greater than <br>
    &amp; → ampersand <br>
    &quot; → double quote <br>
    &apos; → single quote <br>
    &copy; → copyright symbol <br>
    &reg; → registered trademark <br>
    &trade; → trademark symbol
  </p>
</body>
</html>
