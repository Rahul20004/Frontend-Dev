<!DOCTYPE html>
<html lang="en">
<head>
  <title>Form Security Example</title>
</head>
<body>
  <form autocomplete="off">
    <label>Username: <input type="text" required></label><br>
    <label>Password: <input type="password" required></label><br>
    <input type="submit" value="Login">
  </form>

  <p>Note: Disabling autocomplete prevents browsers from storing sensitive form data,
     improving security.</p>
</body>
</html>
