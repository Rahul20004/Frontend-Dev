<!-- 2.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>My City Map</title>
</head>
<body>
  <!-- Google Map iframe -->
  <iframe 
    src="https://www.google.com/maps/embed?pb=..."
    title="My City Map" 
    width="80%" 
    height="60%" 
    loading="lazy">
  </iframe>

  <!-- Comment explaining 'loading' -->
  <!-- The loading="lazy" attribute delays loading of the iframe until it appears in the viewport -->
</body>
</html>
