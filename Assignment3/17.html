<!DOCTYPE html>
<html lang="en">
<head>
  <title>Form with Iframe</title>
</head>
<body>
  <form target="resultFrame" action="result.html" method="get">
    <input type="text" placeholder="Enter text" required>
    <input type="submit" value="Submit">
  </form>

  <iframe name="resultFrame" width="100%" height="100"></iframe>
</body>
</html>
