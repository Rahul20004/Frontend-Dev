<!DOCTYPE html>
<html>
<head>
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="card p-4 shadow-sm">

        <h2 class="mb-3">User Notifications</h2>

        <!-- Alerts -->
        <div class="alert alert-success">New message received!</div>
        <div class="alert alert-info">Tip: Complete your profile for better visibility.</div>
        <div class="alert alert-danger">Warning: Unusual login attempt detected!</div>

        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            This alert can be dismissed.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Summary Well -->
        <div class="bg-light p-3 border rounded">
            <h5>Summary</h5>
            <p>You have 5 new alerts today.</p>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
