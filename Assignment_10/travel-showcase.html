<!DOCTYPE html>
<html>
<head>
    <title>Travel Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Carousel -->
<div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

        <div class="carousel-item active" data-bs-interval="2000">
            <img src="https://via.placeholder.com/1200x500" class="d-block w-100">
            <div class="carousel-caption">
                <h3>Paris</h3>
            </div>
        </div>

        <div class="carousel-item" data-bs-interval="3000">
            <img src="https://via.placeholder.com/1200x500" class="d-block w-100">
            <div class="carousel-caption">
                <h3>Dubai</h3>
            </div>
        </div>

        <div class="carousel-item" data-bs-interval="2500">
            <img src="https://via.placeholder.com/1200x500" class="d-block w-100">
            <div class="carousel-caption">
                <h3>London</h3>
            </div>
        </div>

    </div>
</div>

<!-- Progress Bar -->
<div class="container mt-4">
    <label>Booking Completion</label>
    <div class="progress">
        <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 70%">
            70%
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 mt-4">
    Contact Us: travel@example.com
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
