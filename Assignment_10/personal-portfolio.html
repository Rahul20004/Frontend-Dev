<!DOCTYPE html>
<html>
<head>
    <title>Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="text-center p-5 bg-white">
    <h1 class="fw-bold">Rahul Kumar</h1>
    <p class="text-muted">Frontend Developer | Coder | Tech Enthusiast</p>
</header>

<main class="container text-center mt-4">
    <img src="https://via.placeholder.com/180" class="img-fluid rounded-circle mb-3" alt="Profile">

    <div class="mb-4">
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-secondary">Download CV</button>
    </div>

    <form class="mt-4">
        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Email">
        <textarea class="form-control mb-3" placeholder="Message"></textarea>
        <button class="btn btn-dark w-100">Submit</button>
    </form>
</main>

</body>
</html>
