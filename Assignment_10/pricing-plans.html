<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pricing-plans.css">
</head>
<body>

<div class="container mt-4">
    <div class="row g-4">

        <!-- Basic Plan -->
        <div class="col-md-4">
            <div class="card pricing-card shadow-sm">
                <div class="card-body text-center">
                    <h3>Basic</h3>
                    <h2>$9</h2>
                    <p>Starter features</p>
                </div>
            </div>
        </div>

        <!-- Pro Plan (Highlighted) -->
        <div class="col-md-4">
            <div class="card bg-primary text-white pricing-card shadow-sm">
                <div class="card-body text-center">
                    <h3>Pro</h3>
                    <h2>$19</h2>
                    <p>Advanced features</p>
                </div>
            </div>
        </div>

        <!-- Premium -->
        <div class="col-md-4">
            <div class="card pricing-card shadow-sm">
                <div class="card-body text-center">
                    <h3>Premium</h3>
                    <h2>$29</h2>
                    <p>All features unlocked</p>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
