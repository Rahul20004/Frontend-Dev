<!DOCTYPE html>
<html>
<head>
    <title>Custom Blog</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Theme -->
    <link rel="stylesheet" href="blog-homepage.css">
</head>
<body>

<header class="bg-primary text-white text-center p-4">
    <h1>My Tech Blog</h1>
</header>

<div class="container mt-4">
    <div class="row g-4">

        <!-- Post 1 -->
        <div class="col-md-6">
            <div class="card shadow">
                <img src="https://via.placeholder.com/400" class="card-img-top">
                <div class="card-body">
                    <h3 class="card-title text-primary">Latest AI Trends</h3>
                    <p>Explore how AI is reshaping industries worldwide.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>

        <!-- Post 2 -->
        <div class="col-md-6">
            <div class="card shadow">
                <img src="https://via.placeholder.com/400" class="card-img-top">
                <div class="card-body">
                    <h3 class="card-title text-primary">Web Dev in 2025</h3>
                    <p>The tools and technologies dominating modern web dev.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>

    </div>
</div>

<footer class="bg-dark text-center text-white p-3 mt-4">
    &copy; 2025 My Blog. All rights reserved.
</footer>

</body>
</html>
