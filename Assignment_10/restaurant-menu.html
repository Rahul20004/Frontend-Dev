<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">

    <h1 class="text-center mb-4">Today's Menu</h1>

    <!-- Menu Table -->
    <table class="table table-striped text-center">
        <thead class="table-dark">
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Pasta Alfredo</td><td>Main Course</td><td>$12</td></tr>
            <tr><td>Chicken Soup</td><td>Starter</td><td>$7</td></tr>
            <tr><td>Veg Salad</td><td>Healthy</td><td>$6</td></tr>
        </tbody>
    </table>

    <!-- Chef's Specials -->
    <h3 class="mt-4">Chef's Specials</h3>
    <ul class="list-group mb-4">
        <li class="list-group-item">Grilled Salmon</li>
        <li class="list-group-item">Special Pizza</li>
        <li class="list-group-item">BBQ Chicken</li>
    </ul>

    <!-- Image -->
    <figure class="text-center">
        <img src="https://via.placeholder.com/600x300" class="img-fluid" alt="Food">
        <figcaption class="lead mt-2">A delightful treat prepared fresh!</figcaption>
    </figure>
</div>

</body>
</html>
