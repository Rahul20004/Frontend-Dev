<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors Practice</title>
  <link rel="stylesheet" href="css-selectors.css">
</head>
<body>
  <header>
    <h1>CSS Selectors Demonstration</h1>
  </header>

  <main>
    <section>
      <p>This is an element selector example.</p>
      <p class="highlight">This uses a class selector.</p>
      <p id="unique">This uses an ID selector.</p>
      <a href="#" title="sample">This link uses an attribute selector.</a>

      <div class="parent">
        <p>Child paragraph (descendant selector)</p>
        <span>Sibling example</span>
        <p>Adjacent sibling paragraph</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Created for CSS Selector Practice</p>
  </footer>
</body>
</html>
