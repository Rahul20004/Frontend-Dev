<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo Classes Demo</title>
  <link rel="stylesheet" href="pseudo-classes.css">
</head>
<body>
  <header>
    <h1>Pseudo-Class Demonstration</h1>
  </header>

  <main class="container">
    <section>
      <a href="#">Hover over me</a>
      <p>:hover changes background color</p>
    </section>

    <section>
      <input type="text" placeholder="Focus on me">
      <p>:focus changes border color</p>
    </section>

    <section>
      <button>Click me</button>
      <p>:active changes button color</p>
    </section>

    <section>
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
      </ul>
      <p>:nth-child(odd) highlights alternate list items</p>
    </section>
  </main>
</body>
</html>
